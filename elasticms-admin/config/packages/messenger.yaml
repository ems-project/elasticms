parameters:
    env(MESSENGER_TRANSPORT_DSN): 'redis://localhost:6379/messages'

framework:
    messenger:
        failure_transport: failed

        transports:
            async: "%env(MESSENGER_TRANSPORT_DSN)%"
            failed: 'doctrine://default?queue_name=failed'

        routing:
            'EMS\CoreBundle\Core\Messenger\Message\AsyncMessageInterface': async

        buses:
            command.bus:
                middleware:
                    - emsco.messenger.middleware.user_token_stamp
                    - emsco.messenger.middleware.restore_user_from_stamp