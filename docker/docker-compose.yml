services:
    traefik:
        profiles: [ "all","ems" ]
        labels:
            - "elasticMS"
        extends:
            file: ../demo/docker-compose.yml
            service: traefik

    setup_elk:
        profiles: [ "all","ems" ]
        labels:
            - "elasticMS"
        extends:
            file: ../demo/docker-${ELK_VERSION-elk8}.yml
            service: setup_elk

    es01:
        profiles: [ "all","ems" ]
        extends:
            file: ../demo/docker-${ELK_VERSION-elk8}.yml
            service: es01
        ports:
            - "9201:9200"
        labels:
            - "elasticMS"
            - "traefik.enable=true"
            - "traefik.http.routers.es.rule=Host(`es.localhost`)"
            - "traefik.http.routers.es.entrypoints=web"
            - "traefik.http.routers.es.service=es"
            - "traefik.http.services.es.loadbalancer.server.port=9200"

    kibana:
        profiles: [ "all","ems" ]
        extends:
            file: ../demo/docker-${ELK_VERSION-elk8}.yml
            service: kibana
        labels:
            - "elasticMS"
            - "traefik.enable=true"
            - "traefik.http.routers.kibana.rule=Host(`kibana.localhost`)"
            - "traefik.http.routers.kibana.entrypoints=web"
            - "traefik.http.routers.kibana.service=kibana"
            - "traefik.http.services.kibana.loadbalancer.server.port=5601"

    apm-server:
        profiles: [ "all","ems" ]
        extends:
            file: ../demo/docker-${ELK_VERSION-elk8}.yml
            service: apm-server
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.apm-server.rule=Host(`apm-server.localhost`)"
            - "traefik.http.routers.apm-server.entrypoints=web"
            - "traefik.http.routers.apm-server.service=apm-server"
            - "traefik.http.services.apm-server.loadbalancer.server.port=8200"
        ports:
            - "8200:8200"

    postgres:
        profiles: [ "all","ems" ]
        labels:
            - "elasticMS"
        image: postgres:${POSTGRES_VERSION-17}
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_PASSWORD=adminpg
            - TZ=Europe/Brussels
            - PUID=1000
            - PGID=1000
        volumes:
            - postgres:/var/lib/postgresql/data

    mariadb:
        profiles: [ "all","mariadb" ]
        labels:
            - "elasticMS"
        image: linuxserver/mariadb
        ports:
            - "3306:3306"
        environment:
            - PUID=1000
            - PGID=1000
            - MYSQL_ROOT_PASSWORD=mariadb
            - TZ=Europe/Brussels
        volumes:
            - mariadb:/config

    tika:
        profiles: [ "all","ems" ]
        labels:
            - "elasticMS"
        extends:
            file: ../demo/docker-compose.yml
            service: tika
        ports:
            - "9998:9998"

    minio:
        profiles: [ "all","ems" ]
        labels:
            - "elasticMS"
        extends:
            file: ../demo/docker-compose.yml
            service: minio
        ports:
            - "9000:9000"

    setup_minio:
        profiles: [ "all","ems" ]
        labels:
            - "elasticMS"
        extends:
            file: ../demo/docker-compose.yml
            service: setup_minio

    redis:
        profiles: [ "all","ems" ]
        labels:
            - "elasticMS"
        extends:
            file: ../demo/docker-compose.yml
            service: redis
        ports:
            - "6379:6379"

    redis-commander:
        profiles: [ "all","redis-commander" ]
        image: rediscommander/redis-commander:latest
        environment:
            - REDIS_HOSTS=local:redis:6379
        labels:
            - "elasticMS"
            - "traefik.enable=true"
            - "traefik.http.routers.redis-commander.rule=Host(`redis-commander.localhost`)"
            - "traefik.http.routers.redis-commander.service=redis-commander"
            - "traefik.http.routers.redis-commander.entrypoints=web"
            - "traefik.http.services.redis-commander.loadbalancer.server.port=8081"

    mailserver:
        profiles: [ "all","ems" ]
        labels:
            - "elasticMS"
        extends:
            file: ../demo/docker-compose.yml
            service: mailserver
        ports:
            - "1025:1025"

    mercure:
        profiles: [ "all","ems" ]
        labels:
            - "elasticMS"
        extends:
            file: '../demo/docker-compose.yml'
            service: mercure

    varnish:
        profiles: [ "all","ems" ]
        image: varnish:7.7
        environment:
            - VARNISH_SIZE=256M
        volumes:
            - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
        extra_hosts:
            - "host.docker.internal:host-gateway"
        labels:
            - "elasticMS"
            - "traefik.enable=true"
            - "traefik.http.routers.varnish.rule=Host(`varnish.localhost`)"
            - "traefik.http.routers.varnish.service=varnish"
            - "traefik.http.routers.varnish.entrypoints=web"
            - "traefik.http.services.varnish.loadbalancer.server.port=80"

    keycloak:
        profiles: [ "all","keycloak" ]
        image: quay.io/keycloak/keycloak:24.0
        environment:
            KC_DB: postgres
            KC_DB_VENDOR: POSTGRES
            KC_DB_DATABASE: keycloak
            KC_DB_USERNAME: keycloak
            KC_DB_PASSWORD: password
            KC_DB_URL_HOST: keycloak_db
            KC_DB_SCHEMA: public
            KC_DB_PORT: 5432
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: changeme
            KEYCLOAK_LOGLEVEL: ALL
        volumes:
            - ./keycloak:/data
        ports:
            - "9081:8080"
        command: [ 'start-dev' ]
        depends_on:
            - keycloak_db
        restart: always
        labels:
            - "elasticMS"
            - "traefik.enable=true"
            - "traefik.http.routers.keycloak.rule=Host(`keycloak.localhost`)"
            - "traefik.http.routers.keycloak.entrypoints=web"
            - "traefik.http.routers.keycloak.service=keycloak"
            - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

    keycloak_db:
        profiles: [ "all","keycloak" ]
        image: postgres:13
        environment:
            POSTGRES_DB: keycloak
            POSTGRES_USER: keycloak
            POSTGRES_PASSWORD: password
        volumes:
            - keycloak_data:/var/lib/postgresql/data
        labels:
            - "elasticMS"

    prometheus:
        profiles: [ "all","grafana" ]
        labels:
            - "elasticMS"
        image: prom/prometheus:latest
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        ports:
            - "9090:9090"
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"

    grafana:
        profiles: [ "all","grafana" ]
        image: grafana/grafana-oss:latest
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_INSTALL_PLUGINS=
            - GF_UPDATE_CHECKS_ENABLED=false
        depends_on:
            - prometheus
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana_data:/var/lib/grafana
        ports:
            - "3001:3000"
        restart: unless-stopped
        labels:
            - "elasticMS"
            - "traefik.enable=true"
            - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
            - "traefik.http.routers.grafana.entrypoints=web"
            - "traefik.http.routers.grafana.service=grafana"
            - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  sandbox:
        image: docker.io/smalswebtech/base-php:8.4-cli-dev
        user: ${DOCKER_USER-1000}
        env_file:
            -   ./sandbox.env
        environment:
            NPM_CONFIG_PREFIX: /home/default/.local/npm
        volumes:
            - ./.sandbox:/home/default:rw
            - ../:/workspace:rw
        working_dir: /workspace
        command:
            - bash
            - -lc
            - |
                mkdir -p /home/default/.local/bin /home/default/.local/npm/bin /home/default/.config
                export PATH="/home/default/.local/bin:/home/default/.local/npm/bin:$$PATH"
                grep -qxF 'export PATH="/home/default/.local/bin:/home/default/.local/npm/bin:$$PATH"' /home/default/.bashrc || echo 'export PATH="/home/default/.local/bin:/home/default/.local/npm/bin:$$PATH"' >> /home/default/.bashrc
                grep -qxF "alias pbc='php bin/console'" /home/default/.bashrc || echo "alias pbc='php bin/console'" >> /home/default/.bashrc
                npm config set prefix /home/default/.local/npm
                if ! command -v symfony >/dev/null 2>&1; then
                    curl -sS https://get.symfony.com/cli/installer | bash
                fi
                if [ -d /home/default/.symfony5 ]; then
                    if [ ! -e /home/default/.config/symfony-cli ]; then
                        mv /home/default/.symfony5 /home/default/.config/symfony-cli
                    elif [ -z "$$(find /home/default/.config/symfony-cli -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                        rmdir /home/default/.config/symfony-cli
                        mv /home/default/.symfony5 /home/default/.config/symfony-cli
                    fi
                fi
                if [ -L /home/default/.local/bin/symfony ] && [ "$$(readlink /home/default/.local/bin/symfony)" = "/home/default/.symfony5/bin/symfony" ]; then
                    rm /home/default/.local/bin/symfony
                fi
                if [ ! -e /home/default/.local/bin/symfony ] && [ -x /home/default/.config/symfony-cli/bin/symfony ]; then
                    ln -s /home/default/.config/symfony-cli/bin/symfony /home/default/.local/bin/symfony
                fi
                exec "$${SHELL:-bash}"
        stdin_open: true
        tty: true
        labels:
            - "sandbox"
            - "traefik.enable=true"
            - "traefik.http.routers.sandbox-admin.rule=Host(`sandbox-admin.localhost`)"
            - "traefik.http.routers.sandbox-admin.entrypoints=web"
            - "traefik.http.routers.sandbox-admin.service=sandbox-admin"
            - "traefik.http.services.sandbox-admin.loadbalancer.server.port=8881"
            - "traefik.http.routers.sandbox-web.rule=Host(`sandbox-web.localhost`)"
            - "traefik.http.routers.sandbox-web.entrypoints=web"
            - "traefik.http.routers.sandbox-web.service=sandbox-web"
            - "traefik.http.services.sandbox-web.loadbalancer.server.port=8882"
            - "traefik.http.routers.sandbox-cli.rule=Host(`sandbox-cli.localhost`)"
            - "traefik.http.routers.sandbox-cli.entrypoints=web"
            - "traefik.http.routers.sandbox-cli.service=sandbox-cli"
            - "traefik.http.services.sandbox-cli.loadbalancer.server.port=8883"

volumes:
    elk8_data1:
    os2_data1:
    kibana:
    redis:
    s3:
    mariadb:
    postgres:
    mercure_data:
    mercure_config:
    keycloak_data:
    prometheus_data:
    grafana_data:

networks:
    default:
        name: skeleton
        external: true
