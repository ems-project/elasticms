
services:
    traefik:
        image: "traefik:v3.6"
        command:
            - "--log.level=WARNING"
            - "--api.insecure=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"
        ports:
            - "80:80"
            - "443:443"
            - "8888:8080"
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"

    setup_elk:
        extends:
            file: docker-${ELK_VERSION-elk8}.yml
            service: setup_elk
    es01:
        extends:
            file: docker-${ELK_VERSION-elk8}.yml
            service: es01
        ports:
            - "9200:9200"
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.es.rule=Host(`es.localhost`)"
            - "traefik.http.routers.es.entrypoints=web"
            - "traefik.http.routers.es.service=es"
            - "traefik.http.services.es.loadbalancer.server.port=9200"

    kibana:
        extends:
            file: docker-${ELK_VERSION-elk8}.yml
            service: kibana
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.kibana.rule=Host(`kibana.localhost`)"
            - "traefik.http.routers.kibana.entrypoints=web"
            - "traefik.http.routers.kibana.service=kibana"
            - "traefik.http.services.kibana.loadbalancer.server.port=5601"

    apm-server:
        extends:
            file: docker-${ELK_VERSION-elk8}.yml
            service: apm-server
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.apm-server.rule=Host(`apm-server.localhost`)"
            - "traefik.http.routers.apm-server.entrypoints=web"
            - "traefik.http.routers.apm-server.service=apm-server"
            - "traefik.http.services.apm-server.loadbalancer.server.port=8200"

    postgres:
        image: postgres:17
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_PASSWORD=s3cr3t
            - TZ=Europe/Brussels
            - DB_USER=${DB_USER:-demo}
            - DB_PASSWORD=${DB_PASSWORD:-demo}
            - DB_NAME=${DB_NAME:-demo}
            - DB_SCHEMA=${DB_SCHEMA:-public}
        volumes:
            - postgres:/var/lib/postgresql/data
            - ./configs/postgres:/docker-entrypoint-initdb.d:ro
        # Over TCP: while the init scripts run, the server listens on its Unix
        # socket only, so the admin waits for the demo database to exist.
        healthcheck:
            test: [ "CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres" ]
            interval: 5s
            timeout: 5s
            retries: 10

    tika:
        image: apache/tika
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.tika.rule=Host(`tika.localhost`)"
            - "traefik.http.routers.tika.entrypoints=web"
            - "traefik.http.routers.tika.service=tika"
            - "traefik.http.services.tika.loadbalancer.server.port=9998"

    # ElasticMS's object store (S3 API on :8333). MinIO used to fill this role;
    # its community edition is archived and its images are no longer published,
    # so the demo moved to SeaweedFS -- a maintained S3 server (Apache-2.0). One
    # `weed server` runs the master, a volume server, the filer and the S3
    # gateway. The identity and the bucket are created by s3-init and kept in the
    # filer, on the seaweedfs volume.
    seaweedfs:
        image: docker.io/chrislusf/seaweedfs:4.47
        command: server -dir=/data -s3 -ip.bind=0.0.0.0
        volumes:
            - seaweedfs:/data
        healthcheck:
            # /status on the S3 port answers once the gateway serves requests. Not
            # /healthz: the S3 handler reads it as a bucket name and answers 404.
            test: [ "CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8333/status" ]
            interval: 5s
            timeout: 5s
            retries: 12
        labels:
            # The filer's file browser. It reads and writes every bucket WITHOUT
            # the S3 credentials, so it is published on the local Traefik only.
            - "traefik.enable=true"
            - "traefik.http.routers.seaweedfs.rule=Host(`s3.localhost`)"
            - "traefik.http.routers.seaweedfs.service=seaweedfs"
            - "traefik.http.routers.seaweedfs.entrypoints=web"
            - "traefik.http.services.seaweedfs.loadbalancer.server.port=8888"

    # Creates the bucket and the identity ElasticMS signs with (the keys of
    # docker-elasticms.yml and of the .env.dist files), then exits. Admin, as the
    # MinIO root user these keys used to be. Creating a bucket that exists is a
    # no-op and s3.configure updates an identity in place, so a rerun on an
    # existing volume is harmless. `weed shell` exits 0 when a command fails, so
    # the last step checks the bucket is listed -- waiting for it: a bucket just
    # created can take a few seconds to show (measured up to 6s), and a single
    # check failed the init about half the time.
    s3-init:
        image: docker.io/chrislusf/seaweedfs:4.47
        depends_on:
            seaweedfs:
                condition: service_healthy
        entrypoint: [ "/bin/sh", "-ec" ]
        command:
            - |
              weed_shell() { weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888; }
              echo 's3.bucket.create -name ${S3_BUCKET_NAME:-demo}' | weed_shell
              echo 's3.configure -user elasticms -access_key accesskey -secret_key secretkey -actions Admin -apply' | weed_shell >/dev/null
              tries=0
              until echo 's3.bucket.list' | weed_shell | awk -v b='${S3_BUCKET_NAME:-demo}' '$$1 == b { found = 1 } END { exit !found }'; do
                  tries=$$((tries + 1))
                  [ "$$tries" -lt 60 ] || { echo 'bucket ${S3_BUCKET_NAME:-demo} still not listed after 60s' >&2; exit 1; }
                  sleep 1
              done
              echo 'SeaweedFS bucket ${S3_BUCKET_NAME:-demo} ready'

    redis:
        image: redis:7
        volumes:
            - redis:/var/lib/redis/data

    mercure:
        image: dunglas/mercure
        ports:
            - "3000:80"
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_KEY}
            MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_KEY}
            MERCURE_EXTRA_DIRECTIVES: ${MERCURE_EXTRA_DIRECTIVES}
        healthcheck:
            test: [ "CMD", "wget", "-O-", "http://localhost/healthz" ]
            timeout: 5s
            retries: 5
            start_period: 60s
        volumes:
            - mercure_data:/data
            - mercure_config:/config
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.mercure.rule=Host(`mercure.localhost`)"
            - "traefik.http.routers.mercure.service=mercure"
            - "traefik.http.routers.mercure.entrypoints=web"
            - "traefik.http.routers.mercure-tls.rule=Host(`mercure.localhost`)"
            - "traefik.http.routers.mercure-tls.service=mercure"
            - "traefik.http.routers.mercure-tls.entrypoints=websecure"
            - "traefik.http.routers.mercure-tls.tls=true"
            - "traefik.http.services.mercure.loadbalancer.server.port=80"

    mailserver:
        image: axllent/mailpit
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.mailserver.rule=Host(`mailserver.localhost`)"
            - "traefik.http.routers.mailserver.service=mailserver"
            - "traefik.http.routers.mailserver.entrypoints=web"
            - "traefik.http.routers.mailserver-tls.rule=Host(`mailserver.localhost`)"
            - "traefik.http.routers.mailserver-tls.service=mailserver"
            - "traefik.http.routers.mailserver-tls.entrypoints=websecure"
            - "traefik.http.routers.mailserver-tls.tls=true"
            - "traefik.http.services.mailserver.loadbalancer.server.port=8025"

    admin-local:
        user: ${DOCKER_USER:-1001}:0
        extends:
            file: docker-elasticms.yml
            service: admin
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            default:
                aliases:
                    - local.ems-demo-admin
                    - local.ems-demo-admin-dev
        labels:
            - traefik.enable=true
            - 'traefik.http.routers.admin-local.rule=HostRegexp(`^local\.([a-z0-9\-_\.]+)\-admin\.localhost$$`)'
            - traefik.http.routers.admin-local.entrypoints=web
            - 'traefik.http.routers.admin-local-dev.rule=HostRegexp(`^local\.([a-z0-9\-_\.]+)\-admin\-dev\.localhost$$`)'
            - traefik.http.routers.admin-local-dev.entrypoints=web
            - traefik.http.services.admin-local.loadbalancer.server.port=9000

    web-local:
        user: ${DOCKER_USER:-1001}:0
        extends:
            file: docker-elasticms.yml
            service: web
        environment:
            - TRUSTED_HOSTS=localhost,.*\.localhost
        labels:
            - traefik.enable=true
            - 'traefik.http.routers.skeleton.rule=HostRegexp(`^local\.([a-z0-9\-_\.]+)\-web\-nocache\.localhost$$`)'
            - 'traefik.http.routers.skeleton.entrypoints=web,websecure'
            - traefik.http.routers.skeleton.service=skeleton
            - traefik.http.services.skeleton.loadbalancer.server.port=9000

    # The infra stack's Varnish, in front of the websites as it was before
    # #1767 took it out of the web image: -web hostnames go through it,
    # -web-nocache ones straight to web-local. !reset drops the profiles it
    # carries there, which would keep it from starting here.
    varnish:
        extends:
            file: ../docker/docker-compose.yml
            service: varnish
        profiles: !reset []
        environment:
            - VARNISH_BACKEND_HOST=http://web-local:9000
        labels:
            - 'traefik.http.routers.varnish.rule=Host(`varnish.localhost`) || HostRegexp(`^local\.([a-z0-9\-_\.]+)\-web\.localhost$$`)'
            - traefik.http.routers.varnish.entrypoints=web,websecure

volumes:
    elk8_data1:
    kibana:
    os2_data1:
    redis:
    seaweedfs:
    postgres:
    mercure_data:
    mercure_config:

networks:
    default:
        name: skeleton
