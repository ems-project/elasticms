description:
  en:
    documentation: 'https://ems-project.github.io/#/'
    features:
      - Secure by design
      - WCAG and GDPR Oriented
      - Advanced Customization
    genericName: Content Delivery Application
    longDescription: |
      ElasticMS Web is a Content Delivery Application that publish website(s)
      base on information (twig template, wysiwy content, ..) that are published
      in an elasticsearch index or alias. ElasticMS Web can generate any kind of
      text file but alos PDF, images in various format. ElasticMS Web is part of
      the ElasticMS suite. 


      **Advanced Customization**

      ElasticMS is a highly customizable CMS. It offers numerous extensions to
      provide solutions tailored to advanced needs and specific client
      requirements.


      **WCAG and GDPR Oriented**

      ElasticMS complies with standards aimed at making web content more
      accessible to people with disabilities and also meets user data protection
      requirements.


      **Constant Evolution**

      ElasticMS is a scalable CMS that is continuously evolving through
      technical improvements to meet the real needs of public services and make
      their work easier.


      **Secure by design** 


      The authoritative source of the content is stored in a traditional
      relational database (Postgres, MariaDB, ..). However, applications and
      websites must access the content via Elasticsearch indexes and therefore
      do not have direct access to the authoritative content sources.
    shortDescription: The informative website part of ElasticMS
