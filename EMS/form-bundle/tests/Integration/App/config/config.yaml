parameters:
    locale: 'en'
    env(EMSCH_LOCALES): '["fr","nl"]'
    env(EMSCH_ENVS): '{"preview":{"regex":"/.*/","alias":"test_preview","backend":"https://localhost"}}'

framework:
    test: true
    http_method_override: false
    handle_all_throwables: true
    secret: 1621180219f163d89dc399e88cfc1807ab6448cf
    csrf_protection: ~
    session:
        cookie_samesite: strict
        cookie_secure: auto
        handler_id: ~
        storage_factory_id: session.storage.factory.native
    router:
        resource: 'config/routes.yml'
        utf8: true
        strict_requirements: ~
    php_errors:
        log: true
    validation:
        email_validation_mode: html5
    property_info:
        with_constructor_extractor: true
    profiler:
        collect_serializer_data: true

security:
    firewalls:
        main:
            security: false

doctrine:
    dbal:
        url: 'sqlite:///%kernel.project_dir%/tmp/test.db'
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: sequence

twig:
    debug: true
    strict_variables: true

ems_client_helper:
    locales: '%env(json:EMSCH_LOCALES)%'
    request_environments: '%env(json:EMSCH_ENVS)%'
    elasticms:
        test:
            api: { "enable": true, "name": "backend" }
            hosts: '["http://localhost:9200"]'

ems_common:
    backend_url: 'https://localhost'

services:
    _defaults:
        public: true
