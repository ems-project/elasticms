security:
    role_hierarchy:
        ROLE_AUTHOR: ROLE_USER
        ROLE_FORM_CRM: ROLE_USER
        ROLE_TASK_MANAGER: ROLE_USER
        ROLE_REVIEWER: ROLE_AUTHOR
        ROLE_TRADUCTOR: ROLE_REVIEWER
        ROLE_AUDITOR: ROLE_REVIEWER
        ROLE_COPYWRITER: ROLE_AUDITOR
        ROLE_PUBLISHER: ROLE_COPYWRITER
        ROLE_WEBMASTER: ROLE_PUBLISHER
        ROLE_ADMIN: [ ROLE_WEBMASTER, ROLE_USER_MANAGEMENT ]
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    providers:
        core_api:
            id: emsch.security.core_api.user_provider
        sso:
            id: emsch.security.sso.user_provider
        chain_providers:
            chain:
                providers: [ 'core_api', 'sso' ]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            entry_point: emsch.security.firewall.entry_point
            provider: chain_providers
            custom_authenticators:
                - emsch.security.core_api.authenticator
                - emsch.security.sso.oauth2.authenticator
                - emsch.security.sso.saml.authenticator
            logout:
                path: emsch_logout

    access_control:
        - { path: ^/emsch/api, roles: ROLE_API }
        - { path: ^/, roles: PUBLIC_ACCESS }
